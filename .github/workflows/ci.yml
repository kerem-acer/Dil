name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins the .NET 11 SDK; 10.0 is installed too for the net10.0 test run.
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --solution Dil.slnx --no-build -c Release
